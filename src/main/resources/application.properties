spring.application.name=webar-restaurant
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=2GB
app.frontend-url=${FRONTEND_URL:https://webarqr.netlify.app}

# Phase 3 real reconstruction worker
photogrammetry.worker-url=${PHOTOGRAMMETRY_WORKER_URL:http://localhost:8000}
photogrammetry.timeout-ms=${PHOTOGRAMMETRY_TIMEOUT_MS:30000}
